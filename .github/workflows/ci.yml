name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Core main entry must not import zod
        run: "! grep -q zod packages/core/dist/index.js"
      - run: npm run registry:build
      - run: npm run llms:build        # also validates every recipe schema
      - run: npm run build -w docs
      - run: npm run lint
      # E2E (Playwright) is off until the suite has been run and baselined locally:
      #   npx playwright install chromium && npm run e2e
      # Then restore:
      # - run: npx playwright install --with-deps chromium
      # - run: npm run e2e
      # - uses: actions/upload-artifact@v4
      #   if: failure()
      #   with: { name: playwright-report, path: playwright-report }
