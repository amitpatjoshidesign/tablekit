name: Release
# Manual until npm is set up (the `tablekit` org, plus NPM_TOKEN or trusted publishing).
# Run it from Actions → Release → Run workflow. To automate later, add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build
      # Opens a "Version packages" PR; merging it publishes to npm.
      - uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
